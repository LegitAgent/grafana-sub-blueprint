apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-app
  labels:
    app: java-app
spec:
  replicas: {{ .Values.javaApp.replicas }}
  selector:
    matchLabels: 
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name: hello-world-app
        image: "{{ .Values.javaApp.image.repository }}:{{ .Values.javaApp.image.tag }}"
        imagePullPolicy: {{ .Values.javaApp.image.pullPolicy }}
        ports:
        - containerPort: 8000
    