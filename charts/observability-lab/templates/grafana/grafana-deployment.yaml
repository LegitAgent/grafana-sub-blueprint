apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: {{ .Values.grafana.replicas }}
  selector:
    matchLabels:
      app: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
        imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        ports:
        - name: grafana-port
          containerPort: 3000
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-data

# configs already in Containerfile for grafana, no need configmap
