services:
  grafana:
    image: localhost/grafana-setup-lab:1
    build:
      context: .
      dockerfile: grafana/Containerfile
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - observability
    ports:
      - 3000:3000

  otel-collector:
    image: localhost/otel-collector-setup-lab:1
    build:
      context: .
      dockerfile: otel/Containerfile
    networks:
      - observability

  prometheus:
    image: localhost/prometheus-setup-lab:1
    build:
      context: .
      dockerfile: prometheus/Containerfile
    volumes:
      - prometheus-data:/prometheus # volume name : mounted at x
    networks:
      - observability
    ports: 
      - 9090:9090
  
  jaeger:
    image: localhost/jaeger-setup-lab:1
    build:
      context: .
      dockerfile: jaeger/Containerfile
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - jaeger-data:/var/lib/jaeger
    networks:
      - observability
    ports:
      - 16686:16686

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - observability
    ports:
      - 9200:9200

networks:
  observability:
    # external: true # only for existing

# persistent storage
volumes:
  prometheus-data:
  grafana-data:
    # external: true # same thing
  jaeger-data:
  elasticsearch-data:
