# for docs: https://opentelemetry.io/docs/collector/configuration/

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
# send telemetry data to observability backends and destinations
exporters:
  debug:
    verbosity: detailed
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      exporters: [debug]
