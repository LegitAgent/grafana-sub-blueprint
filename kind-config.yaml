# Single-node Kind cluster with HTTP/HTTPS host port mappings
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 9091
        listenAddress: "127.0.0.1"
      - containerPort: 443
        hostPort: 9443
        listenAddress: "127.0.0.1"
