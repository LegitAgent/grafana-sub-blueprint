global:
  # fetch metrics every n seconds
  scrape_interval: 15s

# target scrapes
# default metric request endpoint are at /metrics, if not, do metrics_path: /path/to/metrics
scrape_configs: 
  # monitor own health, polls localhost:9090/metrics
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          app: prometheus # custom label, for all metrics pulled

  # for the otel collector port
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

